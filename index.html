  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var origFetch = window.fetch;
          var _fetch = origFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _fetch || origFetch;
            },
            set: function(fn) {
              if (typeof fn === 'function') {
                _fetch = fn;
              }
            }
          });
        } catch (e) {
          // fetch getter patch initialized
        }
      })();
    </script>
